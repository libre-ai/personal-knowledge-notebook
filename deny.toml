[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
# Outbound workspace licences are governed by LICENSING.md; this allowlist is
# intentionally restricted to inbound dependencies.
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  # OSI-approved permissive licenses required by the pinned JSON Schema toolchain.
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["libre-ai"]
