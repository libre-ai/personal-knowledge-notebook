[package]
name = "libre-ai-notebook-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
# Qualification-only sentinels compile internal panic/OOM paths into a separate ignored artifact.
qualification-faults = []

[dependencies]
# Feature anchors ensure AES schedules and GHASH/POLYVAL state wipe on the WASM target.
aes.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
ghash.workspace = true
polyval.workspace = true
serde.workspace = true
serde_jcs.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
wit-bindgen.workspace = true
zeroize.workspace = true

[dev-dependencies]
wasmparser.workspace = true
wit-component.workspace = true
