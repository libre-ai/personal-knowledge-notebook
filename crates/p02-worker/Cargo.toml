[package]
name = "p02-worker"
version = "0.1.0"
description = "P02 worker: migrations, job queue consumer and safe fetch"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
blake3.workspace = true
p02-domain = { path = "../p02-domain", version = "=0.1.0" }
p02-fetch = { path = "../p02-fetch", version = "=0.1.0" }
p02-store = { path = "../p02-store", version = "=0.1.0" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-postgres.workspace = true

[dev-dependencies]
p02-store = { path = "../p02-store", version = "=0.1.0", features = ["testing"] }
url.workspace = true

[lints]
workspace = true
